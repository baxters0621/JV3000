<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2410C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gear icon -->
  <g transform="translate(40,60)">
    <!-- Outer gear ring -->
    <path d="M0,-30 L6,-28 L10,-32 L16,-28 L18,-33 L24,-27 L28,-31 L30,-24 L35,-25 L34,-18 L39,-16 L36,-10 L40,-6 L36,-1 L38,5 L33,8 L33,14 L28,15 L26,21 L20,20 L16,25 L10,22 L6,27 L1,24 L-3,29 L-8,26 L-13,30 L-16,25 L-22,28 L-24,22 L-30,24 L-31,18 L-36,18 L-35,11 L-39,8 L-37,2 L-40,-2 L-36,-7 L-38,-13 L-33,-16 L-33,-22 L-27,-23 L-25,-29 L-19,-28 L-15,-33 L-9,-30 L-5,-35 L0,-30Z"
          fill="url(#gearGrad)" transform="rotate(0)" />
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="16" fill="#0F1A2E" />
    <!-- Oil drop in center -->
    <path d="M0,-10 C3,-6 5,-3 5,0 C5,2.8 2.8,5 0,5 C-2.8,5 -5,2.8 -5,0 C-5,-3 -3,-6 0,-10Z"
          fill="#EA580C" />
    <!-- Drop highlight -->
    <ellipse cx="-1.5" cy="-2" rx="1.5" ry="2.5" fill="rgba(255,255,255,0.3)" />
  </g>

  <!-- Text -->
  <text x="90" y="52" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="36" font-weight="800" fill="#0F1A2E">JV</text>
  <text x="145" y="52" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="36" font-weight="300" fill="#EA580C">3000</text>
  <text x="238" y="52" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#64748B">C.A.</text>

  <!-- Tagline -->
  <text x="90" y="78" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="3">LUBRICANTES · LUCES · AUTOMOTRIZ</text>
</svg>
